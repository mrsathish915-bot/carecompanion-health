<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hidden audio element for the alarm sound -->
    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" loop></audio>

    <div class="container">
        <header>
            <h1>Care Companion 💙</h1>
            <p>Your daily medicine alarm</p>
        </header>
        
        <main>
            <div class="add-medicine">
                <input type="text" id="medName" placeholder="Medicine Name (e.g., Vitamin C)">
                <input type="date" id="medDate">
                <input type="time" id="medTime">
                <button onclick="addMedicine()">Set Alarm</button>
            </div>
            
            <ul id="medicineList" class="medicine-list">
                <!-- Reminders will appear here -->
            </ul>
        </main>
    </div>

    <!-- Alarm Popup (Hidden by default) -->
    <div id="alarmPopup" class="popup-overlay hidden">
        <div class="popup-content">
            <h2>⏰ Time for your medicine!</h2>
            <p id="popupMedName" class="highlight-med">Medicine Name</p>
            <div class="popup-buttons">
                <button class="stop-btn" onclick="stopAlarm()">Stop Alarm</button>
                <button class="snooze-btn" onclick="snoozeAlarm()">Snooze (5 mins)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
