<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" loop></audio>

    <div class="container">
        <header>
            <h1>Care Companion 💙</h1>
            <p>Your daily medicine & health alarm</p>
        </header>

        <!-- Profile Selector -->
        <div class="profile-tabs">
            <button class="tab-btn active" onclick="setProfile('Person 1', this)">👨 Person 1 (Husband)</button>
            <button class="tab-btn" onclick="setProfile('Person 2', this)">👩 Person 2 (Wife)</button>
        </div>
        
        <main>
            <div class="add-medicine">
                <input type="text" id="medName" placeholder="Name (e.g., BP Tablet)">
                
                <div class="row-inputs">
                    <select id="medType">
                        <option value="Tablet 💊">Tablet 💊</option>
                        <option value="Syrup 🥄">Syrup 🥄</option>
                        <option value="Injection 💉">Injection 💉</option>
                        <option value="Checkup 🩺">Checkup / BP 🩺</option>
                    </select>
                    <input type="text" id="medInfo" placeholder="Details (e.g., After Food)">
                </div>

                <div class="row-inputs">
                    <input type="date" id="medDate">
                    <input type="time" id="medTime">
                </div>
                
                <button class="add-btn" onclick="addMedicine()">Save Reminder</button>
            </div>
            
            <ul id="medicineList" class="medicine-list">
                <!-- Reminders will appear here -->
            </ul>
        </main>
    </div>

    <!-- Alarm Popup -->
    <div id="alarmPopup" class="popup-overlay hidden">
        <div class="popup-content">
            <h2>⏰ Time for Medicine!</h2>
            <p id="popupUser" class="highlight-user">For: Person</p>
            <p id="popupMedName" class="highlight-med">Medicine Name</p>
            <p id="popupMedInfo">Instructions</p>
            <div class="popup-buttons">
                <button class="stop-btn" onclick="stopAlarm()">Stop Alarm & Mark Taken</button>
                <button class="snooze-btn" onclick="snoozeAlarm()">Snooze (5 mins)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
